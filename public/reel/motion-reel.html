<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>xanti studios — motion reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#dcdcdc; --ink:#000000; --muted:#4a4a4a; --line:#b4b4b4; --btn:#ffffff; --btn-ink:#000000;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#000000; --ink:#ffffff; --muted:#888888; --line:#2a2a2a; --btn:#111111; --btn-ink:#ffffff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#000000; --ink:#ffffff; --muted:#888888; --line:#2a2a2a; --btn:#111111; --btn-ink:#ffffff;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--page);color:var(--ink);
  font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  display:flex;flex-direction:column;overflow:hidden;
}
#vp{position:relative;flex:1;min-height:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#050505;
  box-shadow:0 0 0 1px var(--line)}
#cv{position:absolute;inset:0;width:1920px;height:1080px;display:block}
#logo{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;overflow:visible}
/* Embedded in the website: the controls are hidden so the reel fills the frame. */
.bar{display:none!important}
html,body{background:#050505!important}
.bar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-top:1px solid var(--line);font-size:13px;color:var(--muted);
}
.bar button{
  font:inherit;color:var(--btn-ink);background:var(--btn);border:1px solid var(--line);
  height:34px;min-width:34px;padding:0 12px;border-radius:2px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar svg{width:14px;height:14px;fill:currentColor}
#scrub{flex:1;min-width:60px;accent-color:var(--ink);height:34px}
#time{font-variant-numeric:tabular-nums;color:var(--ink);min-width:118px;text-align:right}
@media (max-width:560px){ #time{min-width:0} .hide-sm{display:none} }
</style>
</head>
<body>
<div id="vp">
  <div id="stage">
    <canvas id="cv" width="1920" height="1080" aria-label="xanti studios motion reel"></canvas>
    <svg id="logo" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="xanti logo">
      <defs>
        <clipPath id="gclipA"><rect x="0" y="0" width="1920" height="0"/><rect x="0" y="0" width="1920" height="0"/><rect x="0" y="0" width="1920" height="0"/></clipPath>
        <clipPath id="gclipB"><rect x="0" y="0" width="1920" height="0"/><rect x="0" y="0" width="1920" height="0"/><rect x="0" y="0" width="1920" height="0"/></clipPath>
      </defs>
      <g id="logoRoot" style="display:none">
        <g id="ghostA" clip-path="url(#gclipA)"></g>
        <g id="ghostB" clip-path="url(#gclipB)"></g>
        <g id="mainLockup"></g>
        <text id="subLeft" x="0" y="0" fill="#888888" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="24" letter-spacing="3"></text>
        <text id="subRight" x="0" y="0" fill="#ffffff" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="24" letter-spacing="3" text-anchor="end"></text>
      </g>
    </svg>
  </div>
</div>
<div class="bar">
  <button id="play" aria-label="Pause"><svg viewBox="0 0 14 14" id="playIcon"><rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/></svg></button>
  <button id="restart" aria-label="Restart"><svg viewBox="0 0 14 14"><path d="M7 1.5a5.5 5.5 0 1 1-5.2 3.7l1.6.5A3.8 3.8 0 1 0 7 3.2V5L3.8 2.4 7 0z"/></svg></button>
  <input id="scrub" type="range" min="0" max="20" step="0.0166667" value="0" aria-label="Timeline">
  <span id="time">00:00:00:00</span>
  <button id="loop" aria-pressed="true" class="hide-sm">Loop</button>
  <button id="fs" aria-label="Fullscreen" class="hide-sm"><svg viewBox="0 0 14 14"><path d="M1 1h4v1.6H2.6V5H1zm8 0h4v4h-1.6V2.6H9zM1 9h1.6v2.4H5V13H1zm10.4 0H13v4H9v-1.6h2.4z"/></svg></button>
</div>

<script>
(() => {
"use strict";
/* ------------------------------------------------------------------ setup */
const W = 1920, H = 1080, FPS = 60, DUR = 20, BEAT = 0.5; // 20s = 10 bars at 120 BPM, loops seamlessly
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const FD = 'Archivo, "Helvetica Neue", Arial, sans-serif';
const FS = '"Instrument Serif", Georgia, "Times New Roman", serif';
const FM = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const HAS_LS = "letterSpacing" in ctx;
const HAS_FST = "fontStretch" in ctx;
const HAS_FILTER = "filter" in ctx;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eOutCubic = x => 1 - Math.pow(1 - clamp(x), 3);
const eInOutCubic = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eOutExpo = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const eInExpo = x => { x = clamp(x); return x === 0 ? 0 : Math.pow(2, 10 * x - 10); };
const eInOutExpo = x => { x = clamp(x); if (x === 0 || x === 1) return x; return x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2; };
const eOutBack = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ls(c, v) { if (HAS_LS) c.letterSpacing = v + "px"; }
const beatEnv = (t, k = 7) => Math.exp(-(((t % BEAT) + BEAT) % BEAT) * k);

let GA = 1;   // global alpha multiplier (used by montage panels)
let LW = 1;   // line width multiplier (thicker lines in small panels)
const A = (c, a) => { c.globalAlpha = clamp(a) * GA; };

function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* ------------------------------------------------------------ logo geometry
   Five arms with square-cut ends and sharp inner corners, one arm pointing up.
   Arm half-width = 0.25 × arm length (fitted to the xanti website icon).      */
const WL = 0.25, DIN = WL / Math.sin(Math.PI / 5), RMAXK = Math.sqrt(1 + WL * WL);
function logoPts(cx, cy, L, rotDeg) {
  const w = WL * L, d = DIN * L, pts = [];
  for (let k = 0; k < 5; k++) {
    const th = (rotDeg + 72 * k) * Math.PI / 180;
    const ux = Math.sin(th), uy = -Math.cos(th), px = Math.cos(th), py = Math.sin(th);
    const t1 = th - Math.PI / 5;
    pts.push([cx + d * Math.sin(t1), cy - d * Math.cos(t1)]);
    pts.push([cx + L * ux - w * px, cy + L * uy - w * py]);
    pts.push([cx + L * ux + w * px, cy + L * uy + w * py]);
  }
  return pts;
}
function logoPath2D(cx, cy, L, rot) {
  const p = new Path2D(); logoPts(cx, cy, L, rot).forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); p.closePath(); return p;
}
function logoD(cx, cy, L) {
  return logoPts(cx, cy, L, 0).map((q, i) => (i ? "L" : "M") + q[0].toFixed(2) + " " + q[1].toFixed(2)).join(" ") + " Z";
}

/* --------------------------------------------- 01 · squash & stretch */
const FLOOR = 760, BR = 54;
function ballH(t) {
  if (t < 0.5) { const u = t / 0.5; return 560 * (1 - u * u); }
  const seg = Math.floor((t - 0.5) / 0.5), u = ((t - 0.5) - seg * 0.5) / 0.5;
  return 430 * Math.pow(0.7, seg) * 4 * u * (1 - u);
}
const ballX = t => 300 + t * 640;
function ballState(t) {
  const h = ballH(t), dt = 1 / 240;
  const v = (ballH(t + dt) - ballH(Math.max(0, t - dt))) / (t - dt < 0 ? dt + t : 2 * dt);
  const k = Math.max(0, Math.round((t - 0.5) / 0.5)), imp = 0.5 + k * 0.5, d = Math.abs(t - imp);
  const s = 1 - ss(d / 0.075);
  const stretch = clamp(Math.abs(v) / 5200) * 0.34 * (1 - s);
  let sy = (1 - 0.42 * s) * (1 + stretch), sx = 1 / sy;
  const ang = (Math.atan2(-v, 640) + Math.PI / 2) * (1 - s);
  return { x: ballX(t), y: FLOOR - h - BR * sy, h, v, sx, sy, ang, s };
}
function sceneSquash(c, lt) {
  const grow = eOutExpo(lt / 0.5);
  // ruler floor
  A(c, 1); c.strokeStyle = "#fff"; c.lineWidth = 2 * LW;
  c.beginPath(); c.moveTo(W / 2 - 800 * grow, FLOOR); c.lineTo(W / 2 + 800 * grow, FLOOR); c.stroke();
  c.strokeStyle = "#444"; c.lineWidth = 1 * LW; c.beginPath();
  for (let x = 160; x <= 1760; x += 40) {
    if (Math.abs(x - W / 2) > 800 * grow) continue;
    const big = (x - 160) % 200 === 0; c.moveTo(x, FLOOR + 6); c.lineTo(x, FLOOR + (big ? 22 : 12));
  }
  c.stroke();
  c.font = `400 13px ${FM}`; c.fillStyle = "#888"; c.textAlign = "center"; ls(c, 1);
  for (let x = 160; x <= 1760; x += 200) { if (Math.abs(x - W / 2) <= 800 * grow) { A(c, grow); c.fillText(String(x - 160), x, FLOOR + 44); } }
  ls(c, 0);
  // impact indicators
  for (let k = 0; k < 6; k++) {
    const tau = 0.5 + 0.5 * k; if (tau > lt) break;
    const age = lt - tau; if (age > 0.75) continue;
    const ix = ballX(tau), p = age / 0.75, rx = BR * 1.1 + eOutExpo(p) * 320;
    A(c, (1 - p) * 0.9); c.strokeStyle = "#fff"; c.lineWidth = 1.5 * LW;
    c.beginPath(); c.ellipse(ix, FLOOR, rx, rx * 0.13, 0, 0, Math.PI * 2); c.stroke();
    A(c, (1 - p) * 0.5); c.beginPath(); c.ellipse(ix, FLOOR, rx * 0.6, rx * 0.08, 0, 0, Math.PI * 2); c.stroke();
    // radial ticks
    A(c, 1 - p); c.beginPath();
    for (let j = -3; j <= 3; j++) { if (!j) continue; const xx = ix + j * (26 + p * 60); c.moveTo(xx, FLOOR - 10 - p * 20); c.lineTo(xx, FLOOR - 26 - p * 30); }
    c.stroke();
    c.font = `600 14px ${FM}`; c.fillStyle = "#fff"; c.textAlign = "center"; ls(c, 2);
    c.fillText("IMPACT 0" + (k + 1), ix, FLOOR + 76);
    c.fillStyle = "#888"; c.font = `400 13px ${FM}`; c.fillText("t=" + tau.toFixed(2) + "s", ix, FLOOR + 96); ls(c, 0);
  }
  // dotted motion trail
  c.fillStyle = "#fff";
  for (let k = 1; k < 46; k++) {
    const tk = lt - k * 0.02; if (tk < 0) break;
    const b = ballState(tk), f = 1 - k / 46;
    A(c, f * 0.9); c.beginPath(); c.arc(b.x, b.y, (1 + 3 * f) * Math.max(1, LW * 0.8), 0, Math.PI * 2); c.fill();
    if (k % 7 === 0) { A(c, f * 0.3); c.strokeStyle = "#888"; c.lineWidth = 1 * LW; c.beginPath(); c.ellipse(b.x, b.y, BR * b.sx, BR * b.sy, b.ang, 0, Math.PI * 2); c.stroke(); }
  }
  // ball
  const b = ballState(lt);
  A(c, 1); c.fillStyle = "#fff"; c.beginPath(); c.ellipse(b.x, b.y, BR * b.sx, BR * b.sy, b.ang, 0, Math.PI * 2); c.fill();
  // velocity vector
  const vx = 640, vy = -b.v, vl = Math.hypot(vx, vy), sc = Math.min(160, vl * 0.06) / vl;
  const ex = b.x + vx * sc, ey = b.y + vy * sc;
  A(c, 0.85 * grow); c.strokeStyle = "#888"; c.lineWidth = 1.5 * LW;
  c.beginPath(); c.moveTo(b.x, b.y); c.lineTo(ex, ey); c.stroke();
  const an = Math.atan2(vy, vx);
  c.beginPath(); c.moveTo(ex, ey); c.lineTo(ex - 12 * Math.cos(an - .4), ey - 12 * Math.sin(an - .4));
  c.moveTo(ex, ey); c.lineTo(ex - 12 * Math.cos(an + .4), ey - 12 * Math.sin(an + .4)); c.stroke();
  // readout
  const rx0 = b.x + BR * 1.6, ry0 = b.y - BR * 1.5;
  A(c, grow); c.strokeStyle = "#555"; c.lineWidth = 1 * LW;
  c.beginPath(); c.moveTo(b.x + BR * 0.75, b.y - BR * 0.75); c.lineTo(rx0 - 6, ry0 + 6); c.lineTo(rx0 + 120, ry0 + 6); c.stroke();
  c.font = `600 15px ${FM}`; c.textAlign = "left"; c.fillStyle = "#fff"; ls(c, 1);
  c.fillText("sx " + b.sx.toFixed(2), rx0, ry0 - 22); c.fillStyle = "#888"; c.fillText("sy " + b.sy.toFixed(2), rx0, ry0 - 2); ls(c, 0);
  // height / time graph
  const gx = 160, gy = 850, gw = 420, gh = 130, prog = clamp(lt / 2.2);
  A(c, grow); c.strokeStyle = "#333"; c.lineWidth = 1 * LW; c.strokeRect(gx, gy, gw, gh);
  c.beginPath(); for (let i = 1; i < 4; i++) { c.moveTo(gx + gw * i / 4, gy); c.lineTo(gx + gw * i / 4, gy + gh); } c.stroke();
  c.beginPath(); c.strokeStyle = "#333"; c.lineWidth = 1.5 * LW;
  for (let i = 0; i <= 120; i++) { const tt = i / 120 * 2.2, x = gx + gw * i / 120, y = gy + gh - ballH(tt) / 560 * (gh - 10); i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
  c.beginPath(); c.strokeStyle = "#fff"; c.lineWidth = 2 * LW;
  const n = Math.floor(120 * prog);
  for (let i = 0; i <= n; i++) { const tt = i / 120 * 2.2, x = gx + gw * i / 120, y = gy + gh - ballH(tt) / 560 * (gh - 10); i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
  const px = gx + gw * prog, py = gy + gh - ballH(lt) / 560 * (gh - 10);
  c.fillStyle = "#fff"; c.beginPath(); c.arc(px, py, 4 * LW, 0, Math.PI * 2); c.fill();
  c.font = `400 13px ${FM}`; c.fillStyle = "#888"; c.textAlign = "left"; ls(c, 1);
  c.fillText("height(t)", gx, gy - 12); c.textAlign = "right"; c.fillText("0.0 — 2.2s", gx + gw, gy - 12); ls(c, 0);
  A(c, 1);
}

/* --------------------------------------------------- 02 · kinetic type */
const WORDS = [
  { t: "COMPUTING", w: 900, fam: FD, st: "ultra-condensed", size: 340, lab: "ARCHIVO 900 / 62.5% WIDTH", ls: -2 },
  { t: "meets", w: 400, fam: FS, it: true, size: 400, lab: "INSTRUMENT SERIF ITALIC / 400", ls: -6 },
  { t: "CREATIVITY", w: 900, fam: FD, st: "ultra-expanded", size: 200, lab: "ARCHIVO 900 / 125% WIDTH", ls: 0 },
  { t: "code()", w: 600, fam: FM, size: 300, lab: "JETBRAINS MONO 600", ls: -10, typed: true },
  { t: "design", w: 400, fam: FS, it: true, size: 420, lab: "INSTRUMENT SERIF ITALIC / 400", ls: -8 },
  { t: "MOTION", wAnim: [100, 900], fam: FD, st: "normal", size: 330, lab: "ARCHIVO 100 → 900", ls: -4 }
];
function wfont(c, wd, u) {
  const wt = wd.wAnim ? Math.round(lerp(wd.wAnim[0], wd.wAnim[1], eInOutCubic(u / 0.75)) / 10) * 10 : wd.w;
  const st = wd.st && wd.st !== "normal" ? wd.st + " " : "";
  c.font = `${wd.it ? "italic " : ""}${wt} ${st}${Math.round(wd.fit || wd.size)}px ${wd.fam}`;
  if (HAS_FST) c.fontStretch = wd.st || "normal";
  ls(c, wd.ls || 0);
}
let BOX = [];
function computeBoxes() {
  WORDS.forEach(wd => { wd.fit = wd.size; wfont(ctx, wd, 1); const mw = ctx.measureText(wd.t); const ww = mw.actualBoundingBoxLeft + mw.actualBoundingBoxRight; if (ww > 1520) wd.fit = wd.size * 1520 / ww; });
  BOX = WORDS.map((wd) => {
    wfont(ctx, wd, 1); const m = ctx.measureText(wd.t);
    const l = m.actualBoundingBoxLeft, r = m.actualBoundingBoxRight, a = m.actualBoundingBoxAscent, d = m.actualBoundingBoxDescent;
    const x0 = W / 2 - (r - l) / 2, y0 = 560 + (a - d) / 2;
    return { x0, y0, x: x0 - l, y: y0 - a, w: l + r, h: a + d, a, d };
  });
  ctx.fontStretch && (ctx.fontStretch = "normal"); ls(ctx, 0);
}
const gcan = document.createElement("canvas"); gcan.width = W; gcan.height = H;
const gctx = gcan.getContext("2d");
function sceneType(c, lt) {
  const i = clamp(Math.floor(lt / BEAT), 0, WORDS.length - 1), u = clamp(lt - i * BEAT, 0, 1) / BEAT;
  const wd = WORDS[i], tb = BOX[i];
  // ---- word into offscreen
  gctx.setTransform(1, 0, 0, 1, 0, 0); gctx.clearRect(0, 0, W, H);
  wfont(gctx, wd, u); gctx.textBaseline = "alphabetic"; gctx.textAlign = "left"; gctx.fillStyle = "#fff";
  const m = gctx.measureText(wd.t);
  const x0 = W / 2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2, y0 = tb.y0;
  const sx = lerp(1.22, 1, eOutExpo(u / 0.55));
  gctx.save();
  gctx.beginPath(); gctx.rect(0, y0 - tb.a - 24, W, tb.a + tb.d + 48); gctx.clip();
  gctx.translate(W / 2, 0); gctx.scale(sx, 1); gctx.translate(-W / 2, 0);
  const chars = [...wd.t], nType = wd.typed ? Math.floor(u / 0.07) : chars.length;
  let lastX = x0;
  for (let k = 0; k < chars.length; k++) {
    if (k >= nType) break;
    const cx = x0 + gctx.measureText(wd.t.slice(0, k)).width;
    let yo = (1 - eOutExpo((u - k * 0.03) / 0.4)) * (tb.a + 30);
    if (wd.typed) yo = 0;
    yo -= eInExpo((u - 0.84 - k * 0.006) / 0.16) * (tb.a + tb.d + 40);
    gctx.fillText(chars[k], cx, y0 + yo);
    lastX = x0 + gctx.measureText(wd.t.slice(0, k + 1)).width;
  }
  if (wd.typed && u < 0.86 && Math.floor(u * 10) % 2 === 0) gctx.fillRect(lastX + 8, y0 - tb.a * 0.75, 26, tb.a * 0.75);
  gctx.restore();
  if (HAS_LS) gctx.letterSpacing = "0px"; if (HAS_FST) gctx.fontStretch = "normal";
  // ---- composite with glitch
  const fr = Math.floor(lt * 60);
  const glitch = u < 0.11 || hash(Math.floor(lt * 14) + 3.3) > 0.88;
  if (glitch) {
    A(c, 0.5); c.drawImage(gcan, 14 + hash(fr) * 10, 0);
    A(c, 1);
    let y = tb.y - 30;
    while (y < tb.y + tb.h + 30) {
      const hgt = 6 + hash(fr * 3.1 + y) * 46, dx = (hash(fr * 7.7 + y * 0.31) - 0.5) * (hash(y + fr) > 0.6 ? 140 : 20);
      c.drawImage(gcan, 0, y, W, hgt, dx, y, W, hgt); y += hgt;
    }
    c.drawImage(gcan, 0, 0, W, tb.y - 30, 0, 0, W, tb.y - 30);
    c.drawImage(gcan, 0, tb.y + tb.h + 30, W, H - tb.y - tb.h - 30, 0, tb.y + tb.h + 30, W, H - tb.y - tb.h - 30);
  } else { A(c, 1); c.drawImage(gcan, 0, 0); }
  // ---- bounding box morph
  const pb = i > 0 ? BOX[i - 1] : { x: W / 2, y: 560, w: 0, h: 0, y0: 560, a: 0 };
  const e = eOutExpo(u / 0.38);
  const bx = lerp(pb.x, tb.x, e), by = lerp(pb.y, tb.y, e), bw = lerp(pb.w, tb.w, e), bh = lerp(pb.h, tb.h, e);
  const base = lerp(pb.y0, tb.y0, e), cap = lerp(pb.y0 - pb.a, tb.y0 - tb.a, e);

      const ni = secIdx(w.t + 0.001), pi = ni - 1;
      drawSec(pi, t);
      bandWipe((t - (w.t - TW / 2)) / TW, w.v, () => drawSec(ni, t));
      done = true; break;
    }
  }
  if (!done) drawSec(secIdx(t), t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; GA = 1; LW = 1;
  drawHUD(t);
  drawGrain(t);
  updateSVG(t);
}

/* -------------------------------------------------------------- playback */
const stage = document.getElementById("stage"), vp = document.getElementById("vp");
const btnPlay = document.getElementById("play"), btnRestart = document.getElementById("restart");
const scrub = document.getElementById("scrub"), timeEl = document.getElementById("time");
const btnLoop = document.getElementById("loop"), btnFs = document.getElementById("fs");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let T = 0, playing = false, loop = true, last = 0;

function fit() {
  const r = vp.getBoundingClientRect(), s = Math.max(r.width / W, r.height / H);
  stage.style.transform = `translate(${(r.width - W * s) / 2}px, ${(r.height - H * s) / 2}px) scale(${s})`;
}
function setPlaying(p) {
  playing = p; last = performance.now();
  btnPlay.setAttribute("aria-label", p ? "Pause" : "Play");
  document.getElementById("playIcon").innerHTML = p
    ? '<rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/>'
    : '<path d="M3 1l10 6-10 6z"/>';
}
function show(t) { T = clamp(t, 0, DUR); render(T); scrub.value = T; timeEl.textContent = timecode(T); }
function tick(now) {
  if (playing) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now; let t = T + dt;
    if (t >= DUR) { if (loop) t = t - DUR; else { t = DUR; setPlaying(false); } }
    show(t);
  }
  requestAnimationFrame(tick);
}
btnPlay.addEventListener("click", () => { if (!playing && T >= DUR) T = 0; setPlaying(!playing); });
btnRestart.addEventListener("click", () => { show(0); setPlaying(true); });
scrub.addEventListener("input", () => { setPlaying(false); show(parseFloat(scrub.value)); });
btnLoop.addEventListener("click", () => { loop = !loop; btnLoop.setAttribute("aria-pressed", String(loop)); });
if (!document.fullscreenEnabled) btnFs.style.display = "none";
btnFs.addEventListener("click", () => { try { document.fullscreenElement ? document.exitFullscreen() : vp.requestFullscreen(); } catch (e) {} });
document.addEventListener("keydown", e => {
  if (e.target === scrub && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
  if (e.key === " ") { e.preventDefault(); btnPlay.click(); }
  else if (e.key === "r" || e.key === "R") btnRestart.click();
  else if (e.key === "l" || e.key === "L") btnLoop.click();
  else if (e.key === "f" || e.key === "F") btnFs.click();
  else if (e.key === "ArrowRight") { setPlaying(false); show(T + 1 / FPS); }
  else if (e.key === "ArrowLeft") { setPlaying(false); show(T - 1 / FPS); }
});
addEventListener("resize", fit);
document.addEventListener("visibilitychange", () => { if (!reduce) setPlaying(!document.hidden); });
document.addEventListener("fullscreenchange", fit);

async function start() {
  fit();
  ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, W, H);
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`900 100px Archivo`), document.fonts.load(`100 100px Archivo`),
        document.fonts.load(`900 ultra-condensed 100px Archivo`), document.fonts.load(`900 ultra-expanded 100px Archivo`),
        document.fonts.load(`italic 400 100px "Instrument Serif"`), document.fonts.load(`600 100px "JetBrains Mono"`),
        document.fonts.load(`400 100px "JetBrains Mono"`)
      ]),
      new Promise(r => setTimeout(r, 3000))
    ]);
  } catch (e) {}
  computeBoxes(); layoutLogo();
  if (reduce) { show(16); setPlaying(false); }
  else { show(0); setPlaying(true); }
  requestAnimationFrame(tick);
}
start();
})();
</script>
